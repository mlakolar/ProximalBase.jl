# What CI runs. Read by test/tiers.jl and scripts/ci_plan.jl and checked by
# test/tier_selection.jl, test/ci_plan.jl and test/ci_verdict.jl; the test files of each tier
# are in test/tiers.toml. CONTRIBUTING.md explains the workflow.
#
# The plan decides six things independently: the tier (how many test files), the platforms
# (which Julia versions and systems run them), coverage, the benchmark reference checks, whether
# each test job must have run the whole catalog of its tier (inventory), and, from the tier, the
# conformance reports. [events.*] says how each kind of run decides them,
# [platforms.*] defines the job lists, [timeouts] and [policy] are per tier, and the risk
# rules below map changed paths to the minimum tier of a pull request. scripts/ci_plan.jl
# validates the [events.*] and [platforms.*] tables and their values (an unknown key, mode or tier
# there is an error). Each of the other tables is validated by its own reader, as that reader
# defines: test/tiers.jl reads [timeouts], [policy] and [[risk]], scripts/ci_plan.jl reads
# [benchmark_check], and scripts/ci_triage.jl reads and validates [triage] (the issue labels, the
# deferred test files and the stale limit of the nightly triage). scripts/ci_verdict.jl keeps its
# own copy of the job lists of the modes, which test/ci_verdict.jl compares with the tables below;
# scripts/ci_result.jl checks the inventory of a test log against the tier lists, and
# scripts/release_record.jl writes the record of a release run (the manual run with release=true).

[timeouts]
# Minutes per CI test job, well above each tier's target to allow for cold caches. A job of a
# platform mode may set its own (macOS below).
quick = 20
standard = 30
thorough = 45
full = 90

# One table per kind of run. A push is told apart from a tag push by its ref type. `release` is
# not a GitHub event: it is the manual run with the input release=true (a release validation of
# the exact commit), planned from its own table.
#   tier:      "risk" (the risk rules and labels below), a tier, or "input" (the manual run's tier).
#   skip_without_tests: a run whose changed paths need no package tests (documentation) has tier
#              none; without it (tag, nightly) the tier is fixed.
#   platforms: a mode of [platforms.*], "by_tier" (platforms_by_tier gives the mode of each tier,
#              none included, and label_platforms the mode that a label opts into) or "input"
#              (the manual run's platforms; "auto" takes auto_platforms of the tier).
#   coverage:  true, false or "input".
#   benchmark: the benchmark reference checks (benchmark/check_only.jl on the quick suite):
#              "paths" (a changed path of [benchmark_check] below, or a label of benchmark_labels),
#              "always", "never" or "input" (the manual run's input, or a tier of benchmark_tiers).
#   inventory: true when every required test job must also show that it ran the whole catalog of
#              the tier and, with the verdict, that it uploaded its own conformance reports; false
#              (the default, so the key may be left out) otherwise.
# A label raises a pull request's tier or leaves it alone, with one exception: test:iterate-narrow
# lowers the tier of its iterate rule (see the risk rules). test:benchmark does not affect the tier.

[events.pull_request]
tier = "risk"
platforms = "by_tier"
coverage = false
benchmark = "paths"
benchmark_labels = ["test:benchmark", "test:full"]
platforms_by_tier = { none = "stable", quick = "stable", standard = "stable", thorough = "linux", full = "linux" }
# test:full opts into the cross-platform matrix; a path rule that needs the full tier runs it
# on Linux only.
label_platforms = { "test:full" = "cross" }

[events.push]
# A push to master: the thorough tier on Linux (none when only documentation changed; a push
# whose previous commit is missing, zero or not fetchable is still thorough).
tier = "thorough"
skip_without_tests = true
platforms = "linux"
coverage = false
benchmark = "paths"

[events.tag]
tier = "full"
platforms = "cross"
coverage = false
benchmark = "always"
inventory = true

[events.schedule]
# The nightly run: the full tier on the cross platforms, with coverage, every night.
tier = "full"
platforms = "cross"
coverage = true
benchmark = "always"
inventory = true

[events.release]
# A manual run with release=true and the full SHA of the commit: the full tier on the cross
# platforms, with coverage, whatever the manual inputs say (the planner rejects a tier or platforms
# input that disagrees).
tier = "full"
platforms = "cross"
coverage = true
benchmark = "always"
inventory = true

[events.workflow_dispatch]
tier = "input"
platforms = "input"
coverage = "input"
benchmark = "input"
benchmark_tiers = ["full"]
auto_platforms = { quick = "linux", standard = "linux", thorough = "linux", full = "cross" }

# The jobs of each platform mode. A job is a Julia version, a system and an architecture; its
# name in CI is "Julia <version> - <os> - <arch> - <tier>". `advisory` jobs are reported and
# do not change the result of the run (continue-on-error); `ptr_jobs` sets the number of test workers (the
# free-memory default gives one worker on the macOS runner); `timeout` replaces the minutes of
# [timeouts] (the 3-core, 3.3 GiB macOS runners take 43-78 min on the full tier and one run was
# cancelled at the 90 min limit, #736).
#   stable: Julia 1 on Linux.
#   linux:  Julia 1 and lts on Linux; the conformance map check and the required report upload
#           run on lts.
#   cross:  linux, Julia 1 on macOS and Windows, and Julia pre on Linux (advisory).
# The conformance map check and the required upload run on Julia lts on Linux when the mode has
# it, otherwise on Julia 1 on Linux; coverage runs on Julia 1 on Linux.

[platforms.stable]
jobs = [
  { version = "1", os = "ubuntu-latest", arch = "x64" },
]

[platforms.linux]
jobs = [
  { version = "lts", os = "ubuntu-latest", arch = "x64" },
  { version = "1", os = "ubuntu-latest", arch = "x64" },
]

[platforms.cross]
jobs = [
  { version = "lts", os = "ubuntu-latest", arch = "x64" },
  { version = "1", os = "ubuntu-latest", arch = "x64" },
  { version = "1", os = "macos-latest", arch = "aarch64", ptr_jobs = "2", timeout = 120 },
  { version = "1", os = "windows-latest", arch = "x64" },
  { version = "pre", os = "ubuntu-latest", arch = "x64", advisory = true },
]

[policy]
# A PR that changes src/ or ext/ and no test file gets at least this tier.
source_without_tests = "standard"

[benchmark_check]
# The paths that start the benchmark reference checks (benchmark/check_only.jl on the quick
# suite, the "Benchmark reference checks" jobs) in the events whose `benchmark` is "paths",
# although the risk rules below give benchmark/** no package tests; the workflow file is one of
# them because it defines these jobs. The benchmark analysis scripts have their own job, which
# always runs.
paths = ["benchmark/*.jl", "benchmark/Project.toml", ".github/workflows/CI.yml"]

[triage]
# The nightly defect triage, read and validated by scripts/ci_triage.jl (an unknown key, a missing
# key and a value of the wrong type are all errors, listed together; test/ci_triage.jl checks that
# every glob below matches a test of test/tiers.toml, so a rename cannot leave the list stale).
# A failure is core (urgent) when it is a Linux job on Julia lts or 1 and a test file that is not
# deferred; every other failure is deferred and is triaged by impact. A master push runs Linux
# jobs only, so its failures are core and have their own alert.
#   deferred:        groups of test files whose failures are normally deferred wherever they
#                    happen: `why` and `files`, globs over test names as in test/tiers.toml.
#   stale_hours:     the nightly is stale when no completed scheduled run was created within this many
#                    hours (manual, release and tag runs do not count).
#   title_alert, title_stale: the titles of the two standing issues.
#   label, rehearsal_label: the label of the triage issues, and the one a rehearsal uses instead.
#   severity_labels, kind_labels: the labels the reporter sets; a maintainer sets triage:bug,
#                    triage:flaky (never closed automatically) and triage:portability.
#   label_style:     the color and description the reporter creates each label with.
stale_hours = 48
title_alert = "CI failing on master"
title_stale = "Nightly CI is stale"
label = "nightly-triage"
rehearsal_label = "nightly-triage-rehearsal"
severity_labels = { core = "triage:core", deferred = "triage:deferred" }
kind_labels = ["triage:unclassified", "triage:bug", "triage:flaky", "triage:portability", "triage:infrastructure"]

[[triage.deferred]]
why = "device-array suites run on the CPU reference backend, not on the hardware"
files = ["gpu", "gpu_smoke", "gpu_extension_ambiguities", "conformance/gpu_arrays"]

[[triage.deferred]]
why = "extreme precision and exponent ranges"
files = ["precision_mixed", "extreme_normals", "int32_exponents", "ldexp_bigfloat", "bigfloat_integer_operands"]

[triage.label_style]
"nightly-triage" = { color = "5319e7", description = "A failure of the nightly run, tracked by the triage reporter" }
"nightly-triage-rehearsal" = { color = "cccccc", description = "A rehearsal of the triage reporter; not a real failure" }
"triage:core" = { color = "b60205", description = "Core CPU correctness failure: fix promptly" }
"triage:deferred" = { color = "fbca04", description = "Normally deferred: triage by impact" }
"triage:unclassified" = { color = "ededed", description = "Cause not yet known" }
"triage:bug" = { color = "d93f0b", description = "A genuine bug" }
"triage:flaky" = { color = "c5def5", description = "Flaky or timing dependent; never closed automatically" }
"triage:portability" = { color = "bfdadc", description = "A test or code that does not port to this system" }
"triage:infrastructure" = { color = "e4e669", description = "The runner, the network or the CI setup, not the package" }

[label_focus]
# Pull request labels that add test files to the run (their tier stays what the paths and the
# tier labels give; with no tests otherwise planned they raise it to quick). The device-array
# suites are in the full tier (nightly runs); a change to the GPU files runs them through the
# rules below, and this label runs them for a change that the rules do not tie to them.
"test:gpu" = ["gpu_smoke", "gpu", "conformance/gpu_arrays"]

# The minimum tier of a PR. Each changed path takes the first rule below that matches it
# (`*` within a directory, `**` across directories); the PR gets the highest of these tiers
# and of its test:standard, test:thorough or test:full labels. A path no rule matches gets
# full. "none": no package tests. Changed test files, and the `focus` files of the matched
# rules, run beside the tier. `narrow`: the tier with the label test:iterate-narrow, which
# applies only when this is the one rule with a `narrow` tier that the PR's paths match.

[[risk]]
why = "the README examples are tests"
tier = "quick"
focus = ["readme"]
paths = ["README.md"]

[[risk]]
why = "the conformance coverage map, which thorough and full runs check, with the complete inventory: the gpu_arrays reports (a full-tier file) are written beside the tier"
tier = "thorough"
focus = ["conformance/gpu_arrays"]
paths = ["docs/design/numerical-contract/coverage.md"]

[[risk]]
why = "the API pages, whose @docs entries test/docstrings.jl checks"
tier = "quick"
paths = ["docs/src/api/**"]

[[risk]]
why = "documentation; the Documentation workflow builds it"
tier = "none"
paths = ["docs/**", "**/*.md", "LICENSE", ".gitignore", "codecov.yml"]

[[risk]]
why = "not part of the package tests (run by their own jobs or by hand)"
tier = "none"
paths = [
  "benchmark/**",
  "test/cuda/**",
  "test/oracles/**",
  "scripts/check_naming.py",
  "scripts/instantiate.jl",
  ".github/workflows/CompatHelper.yml",
  ".github/workflows/Documentation.yml",
  ".github/workflows/TagBot.yml",
]

[[risk]]
why = "the on-demand focused platform workflow and its script: their own test checks them"
tier = "quick"
focus = ["platform_focus"]
paths = [".github/workflows/platform-focused.yml", "scripts/platform_focus.jl"]

[[risk]]
why = "test runner, CI, dependencies or extensions: the whole catalog must still pass"
tier = "full"
paths = [
  ".github/tier-rules.toml",
  ".github/workflows/CI.yml",
  "Project.toml",
  "ext/**",
  "scripts/ci_gate.jl",
  "scripts/ci_plan.jl",
  "scripts/ci_result.jl",
  "scripts/ci_triage.jl",
  "scripts/ci_verdict.jl",
  "scripts/release_record.jl",
  "scripts/test.jl",
  "scripts/test_report.jl",
  "src/lapack.jl",
  "test/conformance/common.jl",
  "test/runtests.jl",
  "test/testutils.jl",
  "test/tiers.jl",
]

[[risk]]
why = "the tier lists decide what every tier runs: a valid edit can move a test out of the PR tiers"
tier = "full"
paths = ["test/tiers.toml"]

[[risk]]
why = "the conformance suite and its report scripts: thorough runs the conformance files and checks the map, with the complete inventory: the gpu_arrays reports (a full-tier file) are written beside the tier"
tier = "thorough"
focus = ["conformance/gpu_arrays"]
paths = ["test/conformance/**", "scripts/conformance_map.jl", "scripts/conformance_run.jl"]

[[risk]]
why = "the shared GPU cases, which the full tier runs"
tier = "quick"
focus = ["gpu", "gpu_smoke"]
paths = ["test/gpu_ambiguities.jl", "test/gpu_prelude.jl", "test/gpu_suite.jl", "test/gpu_suite_basics.jl"]

[[risk]]
why = "a test file: it runs beside the tier"
tier = "quick"
paths = ["test/**"]

[[risk]]
why = "the examples are tests"
tier = "quick"
focus = ["examples"]
paths = ["examples/**"]

# The grids files. atom_iterate_grids, conjugate_basics_grids, constrained_basics_grids,
# lmo_atoms_grids, nested_scaled_grids, scaled_infinite_level_underflow_grids,
# sparse_iterate_basics_grids, symmetric_groups_grids and zero_level_infinite_step_grids are in the
# full tier. Each holds cases that repeat cases of a base file that a lower tier keeps for Float64,
# a Float32 representative or a representative function (test/TESTING.md lists them; the base file
# of constrained_basics_grids is the quick file constrained_basics, which keeps the Float64 pass, a
# Float32 vector and one case of each refusal branch). A pull request runs them, beside its tier,
# for a change to the source of their own family:
#   atom_iterate_grids:          src/atom_iterate.jl, src/functions/norms.jl,
#                                src/functions/sparsegroup.jl, src/functions/nonconvex.jl
#   sparse_iterate_basics_grids: src/sparse_iterate.jl
#   nested_scaled_grids:         src/calculus.jl, the shared sources (src/metric.jl, ...),
#                                src/functions/singular.jl
#   conjugate_basics_grids:      src/calculus.jl, the shared sources, src/functions/losses.jl
#   lmo_atoms_grids:             src/lmo.jl, src/lmo_atoms.jl, the shared sources,
#                                src/functions/singular.jl
#   constrained_basics_grids:    src/constrained.jl
#   scaled_infinite_level_underflow_grids, zero_level_infinite_step_grids, symmetric_groups_grids:
#                                src/calculus.jl and the shared sources
# The last three hold the Float32 passes and indicator-wrapper variants of three thorough-tier
# files (scaled_infinite_level_underflow, zero_level_infinite_step, symmetric_groups) that repeat
# Float64 cases or Float32 representatives those files keep. Their base files are thorough-tier
# files, which a pull request ran when its tier was thorough, and the two thorough rules (the rule
# for src/calculus.jl and the rule for the shared sources) list the three grids files, so those
# pull requests run the cases that moved. A standard-tier rule does not list them: a pull request
# on such a path alone, without a label that raises the tier, did not run those base files, and a grids file would run the Float32 repeats
# without the Float64 cases they repeat.
# Other source paths do not add them as automatic focus files. They still run when the tier of the
# pull request is full (for example a change to src/lapack.jl or another infrastructure path, or
# the label test:full; also the nightly run and tag runs), when the grids file itself changes, when
# another changed path's rule lists them, and when requested by name
# (julia scripts/test.jl <name>_grids).
#
# The iterates. A change to one implementation runs standard and its focus files: the
# iterate's own tests and those of its main interactions, beside the iterate files of quick
# (active_handle, atom_iterate, iterate_invariants, iterate_queries, matrixview,
# sparse_iterate_basics, symmetric_parameters, symmetric_products, wrapper_buffers,
# allocations_basics). With the
# label test:iterate-narrow, which the author sets for a narrow change (CONTRIBUTING.md), it
# runs quick and the same focus files. A change to two implementations runs standard and both
# groups; a shared-semantics or architectural change needs test:thorough, set by hand.
[[risk]]
why = "AtomIterate: groups, activation, copies, products, block steps over groups"
tier = "standard"
narrow = "quick"
focus = ["atom_iterate_grids", "real_iterates", "block_step", "norms", "sparsegroup", "infinite_group_weights"]
paths = ["src/atom_iterate.jl"]

[[risk]]
why = "SparseIterate, SymmetricSparseIterate and the stored-iterate code they share"
tier = "standard"
narrow = "quick"
focus = [
  "sparse_iterate",
  "sparse_iterate_basics_grids",
  "real_iterates",
  "block_step",
  "sparse_value_cost",
  "conformance/failures_storage",
  "symmetric_mul",
  "symmetric_argument",
]
paths = ["src/sparse_iterate.jl"]

[[risk]]
why = "the per-entry parameter checks of SymmetricSparseIterate"
tier = "standard"
narrow = "quick"
focus = [
  "symmetric_parameters_paths",
  "symmetric_parameters_trait",
  "symmetric_parameters_writes",
  "symmetric_parameters_merge",
  "symmetric_parameters_extensions",
]
paths = ["src/symmetric_parameters.jl"]

[[risk]]
why = "shared by every function: interface, traits, numerical helpers, wrappers, steps"
tier = "thorough"
focus = [
  "conjugate_basics_grids",
  "lmo_atoms_grids",
  "nested_scaled_grids",
  "scaled_infinite_level_underflow_grids",
  "symmetric_groups_grids",
  "zero_level_infinite_step_grids",
]
paths = [
  "src/ProximalBase.jl",
  "src/compat.jl",
  "src/functions/spectral.jl",
  "src/interface.jl",
  "src/metric.jl",
  "src/partial.jl",
  "src/precompile.jl",
  "src/spectralfunction.jl",
  "src/testing.jl",
  "src/utils.jl",
]

[[risk]]
why = "the wrappers, whose rejected-step catalog (stepchecks) is in the full tier"
tier = "thorough"
focus = [
  "stepchecks",
  "nested_scaled_grids",
  "conjugate_basics_grids",
  "scaled_infinite_level_underflow_grids",
  "symmetric_groups_grids",
  "zero_level_infinite_step_grids",
]
paths = ["src/calculus.jl"]

