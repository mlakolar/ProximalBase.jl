# Which test tier CI runs. Read by test/tiers.jl for scripts/ci_plan.jl and checked by
# test/tier_selection.jl; the test files of each tier are in test/tiers.toml. CONTRIBUTING.md
# explains the workflow.

[timeouts]
# Minutes per CI test job, well above each tier's target to allow for cold caches.
quick = 20
standard = 30
thorough = 45
full = 90         # the macOS full job sets 120 in .github/workflows/CI.yml (#736)

[policy]
# A PR that changes src/ or ext/ and no test file gets at least this tier.
source_without_tests = "standard"

[benchmark_check]
# The benchmark reference checks (benchmark/check_only.jl on the quick suite, the "Benchmark
# reference checks" jobs) run whenever the package tests run, and also when one of these paths
# changes, although the risk rules below give benchmark/** no package tests. Documentation-only
# changes run neither. The benchmark analysis scripts have their own job, which always runs.
paths = ["benchmark/*.jl", "benchmark/Project.toml"]

# The minimum tier of a PR. Each changed path takes the first rule below that matches it
# (`*` within a directory, `**` across directories); the PR gets the highest of these tiers
# and of its test:standard, test:thorough or test:full labels. A path no rule matches gets
# full. "none": no package tests. Changed test files, and the `focus` files of the matched
# rules, run beside the tier. `narrow`: the tier with the label test:iterate-narrow, which
# applies only when this is the one rule with a `narrow` tier that the PR's paths match.

[[risk]]
why = "the README examples are tests"
tier = "quick"
focus = ["readme"]
paths = ["README.md"]

[[risk]]
why = "the conformance coverage map, which thorough and full runs check"
tier = "thorough"
paths = ["docs/design/numerical-contract/coverage.md"]

[[risk]]
why = "the API pages, whose @docs entries test/docstrings.jl checks"
tier = "quick"
paths = ["docs/src/api/**"]

[[risk]]
why = "documentation; the Documentation workflow builds it"
tier = "none"
paths = ["docs/**", "**/*.md", "LICENSE", ".gitignore", "codecov.yml"]

[[risk]]
why = "not part of the package tests (run by their own jobs or by hand)"
tier = "none"
paths = [
  "benchmark/**",
  "test/cuda/**",
  "test/oracles/**",
  "scripts/check_naming.py",
  "scripts/instantiate.jl",
  ".github/workflows/CompatHelper.yml",
  ".github/workflows/Documentation.yml",
  ".github/workflows/TagBot.yml",
]

[[risk]]
why = "test runner, CI, dependencies or extensions: every tier and platform must still work"
tier = "full"
paths = [
  ".github/tier-rules.toml",
  ".github/workflows/CI.yml",
  "Project.toml",
  "ext/**",
  "scripts/ci_gate.jl",
  "scripts/ci_plan.jl",
  "scripts/test.jl",
  "scripts/test_report.jl",
  "src/lapack.jl",
  "test/conformance/common.jl",
  "test/runtests.jl",
  "test/testutils.jl",
  "test/tiers.jl",
]

[[risk]]
why = "the tier lists decide what every tier runs: a valid edit can move a test out of the PR tiers"
tier = "full"
paths = ["test/tiers.toml"]

[[risk]]
why = "the conformance suite and its report scripts: thorough runs every conformance file and checks the map"
tier = "thorough"
paths = ["test/conformance/**", "scripts/conformance_map.jl", "scripts/conformance_run.jl"]

[[risk]]
why = "the shared GPU cases"
tier = "quick"
focus = ["gpu", "gpu_smoke"]
paths = ["test/gpu_prelude.jl", "test/gpu_suite.jl", "test/gpu_suite_basics.jl"]

[[risk]]
why = "a test file: it runs beside the tier"
tier = "quick"
paths = ["test/**"]

[[risk]]
why = "the examples are tests"
tier = "quick"
focus = ["examples"]
paths = ["examples/**"]

# The iterates. A change to one implementation runs standard and its focus files: the
# iterate's own tests and those of its main interactions, beside the iterate files of quick
# (active_handle, atom_iterate, iterate_invariants, iterate_queries, matrixview,
# sparse_iterate_basics, symmetric_parameters, symmetric_products, wrapper_buffers,
# allocations_basics). With the
# label test:iterate-narrow, which the author sets for a narrow change (CONTRIBUTING.md), it
# runs quick and the same focus files. A change to two implementations runs standard and both
# groups; a shared-semantics or architectural change needs test:thorough, set by hand.
[[risk]]
why = "AtomIterate: groups, activation, copies, products, block steps over groups"
tier = "standard"
narrow = "quick"
focus = ["real_iterates", "block_step", "norms", "sparsegroup", "infinite_group_weights"]
paths = ["src/atom_iterate.jl"]

[[risk]]
why = "SparseIterate, SymmetricSparseIterate and the stored-iterate code they share"
tier = "standard"
narrow = "quick"
focus = [
  "sparse_iterate",
  "real_iterates",
  "block_step",
  "sparse_value_cost",
  "conformance/failures_storage",
  "symmetric_mul",
  "symmetric_argument",
]
paths = ["src/sparse_iterate.jl"]

[[risk]]
why = "the per-entry parameter checks of SymmetricSparseIterate"
tier = "standard"
narrow = "quick"
focus = [
  "symmetric_parameters_paths",
  "symmetric_parameters_trait",
  "symmetric_parameters_writes",
  "symmetric_parameters_merge",
  "symmetric_parameters_extensions",
]
paths = ["src/symmetric_parameters.jl"]

[[risk]]
why = "shared by every function: interface, traits, numerical helpers, wrappers, steps"
tier = "thorough"
paths = [
  "src/ProximalBase.jl",
  "src/compat.jl",
  "src/functions/spectral.jl",
  "src/interface.jl",
  "src/metric.jl",
  "src/partial.jl",
  "src/precompile.jl",
  "src/spectralfunction.jl",
  "src/testing.jl",
  "src/utils.jl",
]

[[risk]]
why = "the wrappers, whose rejected-step catalog (stepchecks) is in the full tier"
tier = "thorough"
focus = ["stepchecks"]
paths = ["src/calculus.jl"]

