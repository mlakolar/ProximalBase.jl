name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'examples/README.md'
      - 'benchmark/**.md'
      - 'test/oracles/**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'examples/README.md'
      - 'benchmark/**.md'
      - 'test/oracles/**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'pre' }}
    timeout-minutes: 60
    env:
      # Full runs: the same condition as the include list and --core below, as a string.
      FULL_TESTS: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests') }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        # Full runs: non-PR events or PRs labelled full-tests.
        # Labels are read when the run starts; add the label before the next push or reopen.
        # The free-memory default gives one worker on the macOS runner.
        include: >-
          ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) &&
          '[{"version": "1", "os": "macos-latest", "arch": "aarch64", "ptr_jobs": "2"},
          {"version": "1", "os": "windows-latest", "arch": "x64"},
          {"version": "pre", "os": "ubuntu-latest", "arch": "x64"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Check naming conventions
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check_naming.py
      - name: Run package tests
        run: julia --color=yes scripts/test.jl ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) && '--core' || '' }}
        env:
          JULIA_TEST_COVERAGE: "${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}"
          PTR_NUM_JOBS: ${{ matrix.ptr_jobs }}
          # Full runs write the conformance reports; an empty value leaves them off.
          CONFORMANCE_REPORT: ${{ env.FULL_TESTS == 'true' && format('{0}/conformance', runner.temp) || '' }}
          CONFORMANCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}-${{ matrix.os }}
          CONFORMANCE_PKG_SHA: ${{ github.sha }}
      - name: Check the conformance coverage map
        # One job checks the committed map: the moving Julia release must not turn master red.
        if: ${{ matrix.version == 'lts' && matrix.os == 'ubuntu-latest' && env.FULL_TESTS == 'true' }}
        shell: bash
        run: julia --startup-file=no scripts/conformance_map.jl "$RUNNER_TEMP/conformance" --check --run-id "$CONFORMANCE_RUN_ID"
        env:
          CONFORMANCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}-${{ matrix.os }}
      - name: Upload the conformance reports
        # !cancelled() keeps the upload after a failed test or check step.
        if: ${{ !cancelled() && env.FULL_TESTS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-reports-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error
          retention-days: 14
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  analysis:
    name: Benchmark analysis controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or later required"'
      - name: Check benchmark analysis and failure preservation
        run: |
          python3 benchmark/check_analysis.py
          python3 benchmark/gpu_solver/check_analysis.py
