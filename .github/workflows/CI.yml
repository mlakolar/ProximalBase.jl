name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia 1 / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Test declared minimal inventory
        run: |
          set -o pipefail
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=yes"])' 2>&1 | tee "${RUNNER_TEMP}/pb-package-tests.log"
      - name: Prepare benchmark environment
        run: julia scripts/instantiate.jl benchmark
      - name: Check frozen benchmark references
        env:
          PB_BASELINE: ${{ runner.temp }}/pb849-baseline
          PB_CANDIDATE: ${{ github.workspace }}
          PB_CHECK_ONLY: '1'
        run: |
          mkdir -p "$PB_BASELINE"
          git archive eff21b6d7d33c622313122f46c6ee71693c101ee src | tar -x -C "$PB_BASELINE"
          julia --project=benchmark benchmark/run.jl
      - name: Lint authored Markdown and generated contract sources
        run: python3 docs/check_markdown.py
      - name: Prepare documentation environment
        run: julia scripts/instantiate.jl docs
      - name: Build strict documentation, doctests and isolated Literate examples
        run: |
          set -o pipefail
          julia --project=docs docs/make.jl 2>&1 | tee "${RUNNER_TEMP}/pb-docs-build.log"
      - name: Check rendered internal links and navigation
        run: |
          set -o pipefail
          python3 docs/check_html.py 2>&1 | tee "${RUNNER_TEMP}/pb-docs-html.log"
      - name: Preserve rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-linux-current-julia
          path: docs/build
          if-no-files-found: error
      - name: Preserve complete validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-validation-logs-linux-current-julia
          path: ${{ runner.temp }}/pb-*.log
          if-no-files-found: error
  required:
    name: PR required jobs
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux current-Julia validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
  gate:
    name: PR merge gate
    if: always()
    needs: [required]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation verdict
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success
  publish-preview:
    name: Publish PR documentation preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    needs: [gate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    steps:
      # The untrusted PR code was run only in the read-only test job.
      # This privileged job checks out gh-pages, never the PR branch, and
      # publishes the already validated HTML artifact without executing it.
      - name: Checkout published pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Download the validated documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-linux-current-julia
          path: ${{ runner.temp }}/docs-preview
      - name: Publish isolated PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HTML_DIR: ${{ runner.temp }}/docs-preview
        shell: bash
        run: |
          set -euo pipefail
          preview_dir="previews/PR${PR_NUMBER}"
          mkdir -p "${preview_dir}"
          rsync -a --delete "${HTML_DIR}/" "${preview_dir}/"
          git add -A -- "${preview_dir}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "docs: publish preview for PR ${PR_NUMBER}"
            git push origin HEAD:gh-pages
          fi
      - name: Show PR preview link in the workflow summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/PR${PR_NUMBER}/"
          {
            echo "## Documentation preview"
            echo ""
            echo "Published validated documentation for PR #${PR_NUMBER}:"
            echo ""
            echo "${preview_url}"
            echo ""
            echo "If the new page is not immediately visible, GitHub Pages may still be updating."
          } >> "${GITHUB_STEP_SUMMARY}"
  deploy-docs:
    name: Publish validated documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [gate]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Prepare documentation environment
        run: julia scripts/instantiate.jl docs
      - name: Retrieve the validated HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-linux-current-julia
          path: docs/build
      - name: Publish development documentation
        run: julia --project=docs docs/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
