name: CI
# The plan job decides what a run does (scripts/ci_plan.jl, policy in .github/tier-rules.toml):
# the test tier, the platforms (the job matrix), coverage, the benchmark reference checks and the
# conformance reports are independent outputs, and the same plan lists the test jobs the verdict
# job must find. The cross platforms are Julia 1 and lts on Linux, Julia 1 on macOS and Windows,
# and Julia pre on Linux (advisory):
# - pull requests: the minimum tier for the changed files, raised by test:standard,
#   test:thorough or test:full labels (quick at least, none for documentation only), on Julia 1
#   and Linux, plus Julia lts from the thorough tier; test:full also runs macOS, Windows and
#   Julia pre (the cross platforms); test:benchmark adds the benchmark reference checks;
# - pushes to master: the thorough tier on Julia 1 and lts on Linux (none for documentation only);
# - tags: the full tier on the cross platforms, with the benchmark reference checks;
# - the nightly run: the full tier on the cross platforms, with coverage and the benchmark
#   reference checks, also when an earlier run passed; a lost coverage upload fails it;
# - manual runs: the tier, platforms (auto: the cross platforms for full, otherwise Julia 1 and
#   lts on Linux), benchmark and coverage inputs (`gh workflow run CI.yml --ref <branch>`);
# - release validation, a manual run with release=true and the full SHA of the commit as
#   expected_sha: the full tier on the cross platforms, with coverage and the benchmark reference
#   checks; the plan rejects a tier or platforms input that disagrees and a commit that is not
#   expected_sha, and the verdict needs the four cross jobs.
# Branch protection requires two checks of pull_request runs. "PR merge gate" starts with the
# run, so a new run (a push or a label) at once replaces the commit's earlier gate with a pending
# one, and it passes when this run's "PR required jobs" passed and the PR's test labels are still
# those of this run. "PR required jobs" itself is required because GitHub re-runs it with a test
# job that is re-run, but not the gate. Other
# events name them "CI result" and "CI required jobs", which are not the names that branch
# protection requires. CONTRIBUTING.md describes the workflow.
# Failures of trusted runs are reported by scripts/ci_triage.jl (the only jobs with issues: write,
# which run default-branch code of a push to master or of the schedule and no pull request or
# manual-branch code): `alert` opens or updates the issue "CI failing on master" after a failed
# verdict of a push to master, `triage` files and resolves one issue per system and test file after
# every nightly run, and `stale` notes a nightly run that is missing or old after each push to
# master. A release run also writes a release record (the `release-record` job: job summary and an
# artifact kept 90 days). Each nightly, tag and release test job also fails unless its log shows
# that it ran exactly the test files of its tier (the step "Check the test inventory").
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - master
    tags: ['*']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier'
        type: choice
        options: [full, thorough, standard, quick]
        default: full
      platforms:
        description: 'Platforms (auto: cross for tier full, otherwise Julia 1 and lts on Linux; stable: Julia 1 on Linux; cross: also macOS, Windows and Julia pre)'
        type: choice
        options: [auto, stable, linux, cross]
        default: auto
      benchmark:
        description: 'Run the benchmark reference checks (they also run with tier full)'
        type: boolean
        default: false
      coverage:
        description: 'Collect coverage (Julia 1 on Linux) and upload it to Codecov'
        type: boolean
        default: false
      release:
        description: 'Release validation of the exact commit: full tier on every platform; needs expected_sha'
        type: boolean
        default: false
      expected_sha:
        description: 'The full 40-character SHA of the commit being validated (required with release)'
        type: string
        default: ''
concurrency:
  # A new commit or label on a PR cancels its older run. Every push to master runs to the end
  # (its own group: a later push must not replace it while it waits). Nightly and manual runs
  # (per inputs) queue, and a newer pending one replaces an older pending one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tier }}-${{ inputs.platforms }}-${{ inputs.benchmark }}-${{ inputs.coverage }}-${{ inputs.release }}-${{ inputs.expected_sha }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Test plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      focus: ${{ steps.plan.outputs.focus }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      timeout: ${{ steps.plan.outputs.timeout }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      coverage: ${{ steps.plan.outputs.coverage }}
      conformance: ${{ steps.plan.outputs.conformance }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
      advisory: ${{ steps.plan.outputs.advisory }}
      release: ${{ steps.plan.outputs.release }}
      inventory: ${{ steps.plan.outputs.inventory }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit, whose first parent is the base branch.
          fetch-depth: 2
      - name: Fetch the commit before the push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || echo "Not found; the push runs its tier."
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Check naming conventions
        run: python3 scripts/check_naming.py
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_TIER: ${{ inputs.tier }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
          DISPATCH_BENCHMARK: ${{ inputs.benchmark }}
          DISPATCH_COVERAGE: ${{ inputs.coverage }}
          DISPATCH_RELEASE: ${{ inputs.release }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
          # Only a manual run is planned with its commit, and only to compare it with expected_sha.
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) args=(--base=HEAD^1 --head=HEAD "--labels=$LABELS") ;;
            push)
              args=("--ref-type=$REF_TYPE")
              if [ "$REF_TYPE" = branch ]; then args+=("--base=$BEFORE" --head=HEAD); fi ;;
            workflow_dispatch)
              args=("--tier=${DISPATCH_TIER:-full}" "--platforms=${DISPATCH_PLATFORMS:-auto}"
                    "--benchmark=${DISPATCH_BENCHMARK:-false}" "--coverage=${DISPATCH_COVERAGE:-false}"
                    "--release=${DISPATCH_RELEASE:-false}" "--expected-sha=$DISPATCH_EXPECTED_SHA" "--sha=$SHA") ;;
            schedule) args=() ;;
          esac
          # Once in about 20 runs on GitHub the planner (2 s locally) hung until the job's timeout;
          # retry once rather than fail the gate for that.
          for attempt in 1 2; do
            timeout 120 julia --startup-file=no scripts/ci_plan.jl "--event=$EVENT" "${args[@]}" && exit 0
            echo "::warning::The plan did not finish (attempt $attempt)."
          done
          exit 1
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ needs.plan.outputs.tier }}
    needs: plan
    if: needs.plan.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    # An advisory job (Julia pre) is reported and not counted.
    continue-on-error: ${{ matrix.advisory }}
    # Per tier in .github/tier-rules.toml, well above the targets to allow for cold caches; a
    # matrix entry may set its own ([platforms.*] there).
    timeout-minutes: ${{ matrix.timeout || fromJSON(needs.plan.outputs.timeout) }}
    env:
      # Thorough and full runs write and check the conformance reports (decided by the plan). Full
      # runs every conformance file; thorough all but gpu_arrays (a full-tier file), which a change
      # to the conformance suite, its scripts or the coverage map, or the label test:gpu, adds.
      # Without it the check compares a partial inventory; below full the artifacts are named
      # ...-partial-...
      CONFORMANCE: ${{ needs.plan.outputs.conformance }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      # {"include": [{version, os, arch, advisory, map, coverage, ptr_jobs?, timeout?}, ...]},
      # written by the plan from the platform mode.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Run package tests
        id: tests
        shell: bash
        run: |
          echo "Tier $TIER${FOCUS:+ with $FOCUS} at $COMMIT (checked out $GITHUB_SHA)"
          start=$(date +%s)
          status=0
          julia --color=yes scripts/test.jl --verbose "--tier=$TIER" ${FOCUS:+"--extra=$FOCUS"} 2>&1 | tee "$RUNNER_TEMP/test-output.log" || status=$?
          echo $(( $(date +%s) - start )) > "$RUNNER_TEMP/test-seconds"
          exit $status
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          FOCUS: ${{ needs.plan.outputs.focus }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # Coverage roughly doubles compile time, so only the runs that ask for it collect it,
          # on the matrix entry that carries the flag (Julia 1 on Linux).
          JULIA_TEST_COVERAGE: "${{ matrix.coverage && needs.plan.outputs.coverage == 'true' }}"
          PTR_NUM_JOBS: ${{ matrix.ptr_jobs }}
          # An empty value leaves the conformance reports off.
          CONFORMANCE_REPORT: ${{ env.CONFORMANCE == 'true' && format('{0}/conformance', runner.temp) || '' }}
          CONFORMANCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}-${{ matrix.os }}
          CONFORMANCE_PKG_SHA: ${{ github.sha }}
      - name: Timing summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: julia --startup-file=no scripts/test_report.jl "$RUNNER_TEMP/test-output.log" "$(cat "$RUNNER_TEMP/test-seconds")" >> "$GITHUB_STEP_SUMMARY"
        env:
          TEST_REPORT_TITLE: Julia ${{ matrix.version }}, ${{ matrix.os }}, tier ${{ needs.plan.outputs.tier }}
      - name: Check the test inventory
        # A nightly, tag or release job fails unless the runner's header announced exactly the files
        # of its tier (scripts/ci_result.jl, tested in test/ci_result.jl), so a job that ran fewer
        # files cannot count as a pass. The plan's `inventory` output says which runs need it.
        if: ${{ !cancelled() && needs.plan.outputs.inventory == 'true' && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: julia --startup-file=no scripts/ci_result.jl check-inventory "$RUNNER_TEMP/test-output.log" "--tier=$TIER" ${FOCUS:+"--extra=$FOCUS"}
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          FOCUS: ${{ needs.plan.outputs.focus }}
      - name: Check the conformance coverage map
        # One job checks the committed map: the moving Julia release must not turn master red.
        # It is Julia lts on Linux when the run has it, otherwise Julia 1 on Linux (matrix.map).
        if: ${{ matrix.map && env.CONFORMANCE == 'true' }}
        shell: bash
        run: julia --startup-file=no scripts/conformance_map.jl "$RUNNER_TEMP/conformance" --check --run-id "$CONFORMANCE_RUN_ID" --tier "$TIER" --extra "$FOCUS"
        env:
          CONFORMANCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}-${{ matrix.os }}
          TIER: ${{ needs.plan.outputs.tier }}
          FOCUS: ${{ needs.plan.outputs.focus }}
      - name: Check that the conformance reports were written
        # Required on every job. The upload below may be best-effort; the reports are not.
        if: ${{ !cancelled() && env.CONFORMANCE == 'true' }}
        shell: bash
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/conformance/*/*.jsonl)
          echo "${#reports[@]} conformance report files"
          [ ${#reports[@]} -gt 0 ] || { echo "::error::The test step wrote no conformance reports."; exit 1; }
      # Upload policy: an upload counts only when its step succeeded and returned an artifact id;
      # otherwise it is retried once after 30 s, on each job that writes the reports. The artifact of the matrix.map job
      # (Julia lts, Linux, when the run has it) is the one the coverage map is regenerated from,
      # so its upload stays required; on the other
      # jobs an unconfirmed upload after the retry is a warning in the job and its summary,
      # because the reports themselves were checked above and GitHub's artifact service failed.
      # !cancelled() keeps the upload after a failed test or check step. Only a run whose test step
      # succeeded is named conformance-reports-...: the rows record passes and known breaks, not
      # unexpected failures, so a matching map alone does not show that the tests passed. A failed
      # check step after successful tests still gives a usable baseline. Below the full tier the
      # name has the infix -partial (conformance-reports-partial-...): those reports may lack
      # gpu_arrays and never serve to regenerate the map.
      - name: Upload the conformance reports
        id: upload
        if: ${{ !cancelled() && env.CONFORMANCE == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tests.outcome == 'success' && 'conformance-reports' || 'diagnostic-conformance-reports' }}${{ needs.plan.outputs.tier != 'full' && '-partial' || '' }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error
          retention-days: 14
      - name: Wait before retrying the upload
        if: ${{ !cancelled() && env.CONFORMANCE == 'true' && (steps.upload.outcome != 'success' || steps.upload.outputs.artifact-id == '') }}
        shell: bash
        run: sleep 30
      - name: Upload the conformance reports (retry)
        id: upload_retry
        if: ${{ !cancelled() && env.CONFORMANCE == 'true' && (steps.upload.outcome != 'success' || steps.upload.outputs.artifact-id == '') }}
        continue-on-error: ${{ !matrix.map }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tests.outcome == 'success' && 'conformance-reports' || 'diagnostic-conformance-reports' }}${{ needs.plan.outputs.tier != 'full' && '-partial' || '' }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error
          retention-days: 14
          overwrite: true # a first attempt may have created the artifact before it failed
      - name: Conformance report upload result
        if: ${{ !cancelled() && env.CONFORMANCE == 'true' }}
        shell: bash
        env:
          FIRST: ${{ steps.upload.outcome }}
          FIRST_ID: ${{ steps.upload.outputs.artifact-id }}
          RETRY: ${{ steps.upload_retry.outcome }}
          RETRY_ID: ${{ steps.upload_retry.outputs.artifact-id }}
          REQUIRED: ${{ matrix.map }}
          TESTS: ${{ steps.tests.outcome }}
          JOB: Julia ${{ matrix.version }}, ${{ matrix.os }}
        # Exits 1 when the required upload is unconfirmed, after writing the job summary.
        run: julia --startup-file=no scripts/ci_upload_result.jl
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage && needs.plan.outputs.coverage == 'true'
      - uses: codecov/codecov-action@v7
        if: matrix.coverage && needs.plan.outputs.coverage == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A lost coverage upload makes the nightly and a release run red; the triage reporter
          # records it as an infrastructure failure (the failed step is not the test step). Other
          # runs that ask for coverage are unchanged.
          fail_ci_if_error: ${{ github.event_name == 'schedule' || needs.plan.outputs.release == 'true' }}
  benchmark-check:
    # Every reference check of the quick benchmark suite, without timing (benchmark/check_only.jl),
    # after the driver's own tests. The extended suite stays a manual run.
    name: Benchmark reference checks - Julia ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # julia-actions/cache deletes its old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Prepare the benchmark environment
        run: julia --color=yes benchmark/setup.jl . "$RUNNER_TEMP/benchmark-env"
      - name: Test the check-only driver
        run: julia --color=yes --project="$RUNNER_TEMP/benchmark-env" benchmark/check_only_test.jl
      - name: Check the quick suite
        run: julia --color=yes --project="$RUNNER_TEMP/benchmark-env" benchmark/check_only.jl
        env:
          JULIA_NUM_THREADS: "1"
          PB_SUITE: quick
          PB_EXPECTED_PACKAGE_ROOT: ${{ github.workspace }}
          # Every failure with its full stack trace, written as it occurs (uploaded below).
          PB_OUTPUT: ${{ runner.temp }}/benchmark-check
      - name: Upload the failures
        # Best effort: the job has already failed.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-check-errors-${{ matrix.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-check
          if-no-files-found: warn
          retention-days: 14
  analysis:
    name: Benchmark analysis controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or later required"'
      - name: Check benchmark analysis and failure preservation
        run: |
          python3 benchmark/check_analysis.py
          python3 benchmark/gpu_solver/check_analysis.py
  verdict:
    # Runs after the plan, the tests, the benchmark reference checks and the benchmark controls,
    # even when one of them failed or was cancelled (scripts/ci_verdict.jl, tested in
    # test/ci_verdict.jl). It passes only if the plan and the benchmark controls passed, the
    # reference checks passed when the plan asked for them (and were skipped when it did not),
    # and, when the plan asked for tests, each test job the plan lists as required passed, the
    # list holds the floor of the event and the jobs of the plan's platforms mode (a recognized
    # mode is required when tests run), the advisory list holds at most Julia pre, and no other
    # Julia job ran; with no tests each listed Julia job must have been skipped. Julia pre is
    # advisory. A job list it cannot read fails it. The nightly run, a tag push and a release run
    # also need each required job's own conformance reports artifact, and a release run the full
    # tier, the cross floor and the exact commit; the artifact list it cannot read fails them.
    # Branch protection requires it beside the gate below, which waits for it: re-running a
    # single test job re-runs this job too, but not the gate.
    name: ${{ github.event_name == 'pull_request' && 'PR required jobs' || 'CI required jobs' }}
    needs: [plan, test, benchmark-check, analysis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # the conclusions of this run's test jobs
      contents: read
    outputs:
      failed: ${{ steps.verdict.outputs.failed }}
      linux_failed: ${{ steps.verdict.outputs.linux_failed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_verdict.jl
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Check the required jobs
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.test.result }}
          ANALYSIS: ${{ needs.analysis.result }}
          BENCHMARK: ${{ needs.benchmark-check.result }}
          RUN_BENCHMARK: ${{ needs.plan.outputs.benchmark }}
          RUN_TESTS: ${{ needs.plan.outputs.run_tests }}
          TIER: ${{ needs.plan.outputs.tier }}
          FOCUS: ${{ needs.plan.outputs.focus }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          ADVISORY: ${{ needs.plan.outputs.advisory }}
          RELEASE: ${{ needs.plan.outputs.release }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The script exits 0 (passed) or 1 (failed). Another status (a crash, or the time limit,
          # as for the planner) is retried once; it does not count as a pass.
          for attempt in 1 2; do
            status=0
            timeout 120 julia --startup-file=no scripts/ci_verdict.jl || status=$?
            { [ $status -eq 0 ] || [ $status -eq 1 ]; } && exit $status
            echo "::warning::The verdict script did not finish (attempt $attempt, status $status)."
          done
          exit 1
  gate:
    # Required by branch protection with "PR required jobs". It has no `needs`, so GitHub creates
    # its check when the run starts: a new run on a commit (a push, or a label on the same commit)
    # shows a pending gate at once, not the green gate of an earlier run. It waits for this run's
    # verdict job and passes only if it passed (scripts/ci_gate.jl, test/ci_gate.jl). For a pull
    # request it also fails when the PR's test labels are no longer those this run was planned
    # with, so a re-run of an older run does not pass for a newer one.
    # It reads this run's jobs and the PR's labels and runs no tests, so its token is read-only.
    name: ${{ github.event_name == 'pull_request' && 'PR merge gate' || 'CI result' }}
    runs-on: ubuntu-latest
    # Above the full tier's queue and test time; the script gives up at 170 minutes.
    timeout-minutes: 180
    permissions:
      actions: read # this run's jobs
      contents: read
      pull-requests: read # the PR's current labels
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_gate.jl
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Wait for the required jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ github.event_name == 'pull_request' && 'PR merge gate' || 'CI result' }}
          VERDICT: ${{ github.event_name == 'pull_request' && 'PR required jobs' || 'CI required jobs' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >-
          julia --startup-file=no scripts/ci_gate.jl "--repo=$GITHUB_REPOSITORY" "--run-id=$GITHUB_RUN_ID"
          "--attempt=$GITHUB_RUN_ATTEMPT" "--sha=$COMMIT" "--event=$GITHUB_EVENT_NAME" "--gate=$GATE"
          "--verdict=$VERDICT" "--pr=$PR_NUMBER" "--labels=$LABELS"
  alert:
    # A failed verdict of a push to master: the issue "CI failing on master" (scripts/ci_triage.jl
    # alert). Tags, manual runs, pull requests and the nightly run do not trigger it. Only trusted
    # runs get write access to issues, and the code of this job is the pushed commit of master; no
    # pull request or manual-branch code runs here, and no event field is part of a script line.
    name: Alert for a failing master run
    needs: verdict
    if: always() && needs.verdict.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-alert
      cancel-in-progress: false
    permissions:
      actions: read # the jobs of this run and their logs
      contents: read
      issues: write # open or update the issue
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.verdict.outputs.failed }}
          LINUX_FAILED: ${{ needs.verdict.outputs.linux_failed }}
        run: julia --startup-file=no scripts/ci_triage.jl alert
  triage:
    # The nightly run, green or red (scripts/ci_triage.jl triage): one issue per system and test
    # file for the failures, and the resolution of the issues whose file passed. It must run when
    # the verdict passed (to resolve issues) and when the plan or the verdict failed, so only a
    # cancelled run skips it: `!cancelled()` runs after a failed need like `always()` does, but it
    # also stops a running triage job when the run is cancelled, which `always()` would not. Only the schedule triggers it: it has write access to issues, and what it runs is
    # the code of the default branch; no pull request or manual-branch code runs here, and no
    # event field is part of a script line.
    name: Triage the nightly run
    needs: [plan, verdict]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.verdict.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-triage
      cancel-in-progress: false
    permissions:
      actions: read # the jobs of this run and their logs
      contents: read
      issues: write # open, comment on, reopen and close the triage issues
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: File and resolve the triage issues
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          ADVISORY: ${{ needs.plan.outputs.advisory }}
        run: julia --startup-file=no scripts/ci_triage.jl triage
  stale:
    # Every push to master (scripts/ci_triage.jl stale): the issue "Nightly CI is stale" when the
    # last completed nightly run is older than the limit in .github/tier-rules.toml. It has no
    # `needs`, so it also reports when the rest of the run failed. It has write access to issues,
    # so only a push to master (the code of that commit) triggers it; no pull request or
    # manual-branch code runs here, and no event field is part of a script line.
    name: Check that the nightly run is recent
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-stale
      cancel-in-progress: false
    permissions:
      actions: read # the scheduled runs of the workflow
      contents: read
      issues: write # open or update the issue
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: julia --startup-file=no scripts/ci_triage.jl stale
  release-record:
    # A release run (the plan's `release` output; a manual run with release=true) writes the record
    # of the validation: PASSED or FAILED, the exact commit, the jobs and artifacts of the run, and
    # a section for the decisions of a maintainer (scripts/release_record.jl, tested in
    # test/release_record.jl). It writes the job summary and the artifact `release-record`, kept
    # 90 days. The script says PASSED only when the plan, the tests, the verdict and the gate
    # succeeded and the run is of the commit named by expected_sha. This job fails when the record
    # cannot be written or uploaded. It reads this run's jobs and writes nothing else.
    name: Release record
    needs: [plan, test, verdict, gate]
    if: always() && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and artifacts
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare the workflow files with the default branch
        id: differs
        shell: bash
        run: |
          # true: the CI workflow, its rules, the check scripts or the test selection files differ from the default branch;
          # unknown: the default branch could not be fetched.
          differs=unknown
          if git fetch --no-tags --depth=1 origin master; then
            status=0
            git diff --quiet FETCH_HEAD -- .github/workflows/CI.yml .github/tier-rules.toml 'scripts/ci_*.jl' scripts/release_record.jl scripts/test.jl scripts/conformance_map.jl scripts/conformance_run.jl test/runtests.jl test/tiers.jl test/tiers.toml || status=$?
            case $status in
              0) differs=false ;;
              1) differs=true ;;
            esac
          fi
          echo "differs=$differs" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Write the release record
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.test.result }}
          VERDICT: ${{ needs.verdict.result }}
          GATE: ${{ needs.gate.result }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_DIFFERS: ${{ steps.differs.outputs.differs }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        # The script also appends the record to the job summary.
        run: julia --startup-file=no scripts/release_record.jl "$RUNNER_TEMP/release-record/release-record.md"
      - name: Upload the release record
        uses: actions/upload-artifact@v7
        with:
          name: release-record
          path: ${{ runner.temp }}/release-record
          if-no-files-found: error
          retention-days: 90
