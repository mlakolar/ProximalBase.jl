name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A superseded pull-request run in the same group is cancelled. A push or
  # manual run has its own group per run id, so another run does not cancel or
  # replace it, including a run for the same commit. A push is classified by
  # the net difference between the trees of its `before` commit and the pushed
  # commit.
  group: minimal-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # `changes` classifies the changed files. When every changed path is
  # documentation, `docs_only` is 'true': `test` and `benchmark` are skipped
  # and `required` expects them to be skipped. They run when `docs_only` is
  # 'false'. If the output is missing or empty, both jobs are skipped (their
  # condition compares with 'false') and `required` fails because `docs_only`
  # is neither 'true' nor 'false'. If `changes` fails, `required` fails.
  changes:
    name: Change classification / Linux
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the change classifier
        run: python3 -B scripts/test_ci_changes.py
      - name: Classify the changed files
        id: classify
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changes.py
      # The classifier's base is the first parent of a pull-request merge
      # commit or the `before` commit of a push. It is empty when a push has
      # no usable `before` commit and for a manual run; the check then falls
      # back to HEAD^1, which exists unless HEAD is a root commit. The check
      # inspects the added, copied, modified and renamed blobs (ACMR) in the
      # range.
      - name: Check repository hygiene
        env:
          BASE: ${{ steps.classify.outputs.base }}
        run: |
          python3 scripts/test_repo_hygiene.py
          python3 scripts/check_repo_hygiene.py --base "${BASE:-HEAD^1}"
  # The validation lanes run concurrently.
  test:
    name: Julia 1.13 / Linux (tests ${{ matrix.shard }}/3)
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Test declared minimal inventory (shard ${{ matrix.shard }}/3)
        run: |
          set -o pipefail
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--shard=${{ matrix.shard }}/3"], julia_args=["--check-bounds=yes"])' 2>&1 | tee "${RUNNER_TEMP}/pb-package-tests-shard-${{ matrix.shard }}.log"
      - name: Preserve package validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-validation-logs-linux-julia-1.13-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pb-package-tests-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
  benchmark:
    name: Frozen benchmark differential / Linux
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Prepare benchmark environment
        run: julia scripts/instantiate.jl benchmark
      - name: Check frozen benchmark references
        env:
          PB_BASELINE: ${{ runner.temp }}/pb849-baseline
          PB_CANDIDATE: ${{ github.workspace }}
          PB_CHECK_ONLY: '1'
        run: |
          set -o pipefail
          mkdir -p "$PB_BASELINE"
          git archive eff21b6d7d33c622313122f46c6ee71693c101ee src | tar -x -C "$PB_BASELINE"
          julia --project=benchmark benchmark/run.jl 2>&1 | tee "${RUNNER_TEMP}/pb-benchmark-differential.log"
      - name: Preserve benchmark differential logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-validation-logs-linux-julia-1.13
          path: ${{ runner.temp }}/pb-benchmark-differential.log
          if-no-files-found: ignore
  docs:
    name: Strict documentation / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch exact documentation provenance commits
        run: |
          set -euo pipefail
          provenance_commits="$(python3 - <<'PY'
          import json
          from pathlib import Path
          audit = Path("docs/audit/docs-tracks-1019")
          revisions = {json.loads((audit / "baseline.json").read_text())["baseline"]}
          receipts = audit / "upstream.json"
          if receipts.is_file():
              for record in json.loads(receipts.read_text())["changes"]:
                  for event in record["events"]:
                      revisions.update((event["before_commit"], event["after_commit"]))
                  if "reviewed_move" in record:
                      move = record["reviewed_move"]
                      revisions.update((move["before_commit"], move["after_commit"]))
          print("\n".join(sorted(revisions)))
          PY
          )"
          while IFS= read -r revision; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "${revision}^{tree}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$revision"
            fi
          done <<< "$provenance_commits"
      - name: Check source scope when the migration ledger changes
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare the tested PR merge tree with its exact base parent. For a
          # master push, compare the whole push, including multiple commits.
          scope_base="$(python3 - <<'PY'
          import os, subprocess
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              base = os.environ["PUSH_BEFORE_SHA"]
          else:
              header = subprocess.check_output(["git", "cat-file", "commit", "HEAD"], text=True).split("\n\n", 1)[0]
              parents = [line.split()[1] for line in header.splitlines() if line.startswith("parent ")]
              if os.environ["GITHUB_EVENT_NAME"] == "pull_request" and len(parents) != 2:
                  raise SystemExit("Expected the checked-out pull-request merge commit")
              base = parents[0] if parents else "0" * 40
          print(base)
          PY
          )"
          [[ "$scope_base" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$scope_base" == 0000000000000000000000000000000000000000 ]]; then
            scope_base="$(git mktree < /dev/null)"
          elif ! git cat-file -e "${scope_base}^{tree}" 2>/dev/null; then
            # This one comparison tree is separate from the frozen docs
            # baseline; no unrelated history is needed for either check.
            git fetch --no-tags --depth=1 origin "$scope_base"
          fi
          # The baseline-free line report also covers documentation added
          # after the frozen ledger, even when no ledger row changes.
          printf 'PB_DOCS_DIFF_BASE=%s\n' "$scope_base" >> "$GITHUB_ENV"
          if ! git diff --quiet "$scope_base" HEAD -- docs/audit/docs-tracks-1019/ledger.tsv; then
            git diff --exit-code "$scope_base" HEAD -- src test
            printf 'PB_DOCS_SCOPE_BASE=%s\n' "$scope_base" >> "$GITHUB_ENV"
          fi
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Lint authored Markdown and generated contract sources
        run: python3 docs/check_markdown.py
      - name: Check contract schema and migration-checker fixtures
        run: |
          python3 -B docs/check_contract_schema.py
          python3 -B -m unittest discover -s docs -p 'test_migration_checks.py'
      - name: Check that source and test comments and testset names cite no numerical rule labels
        run: |
          julia --startup-file=no docs/check_source_labels.jl --self-test
          julia --startup-file=no docs/check_source_labels.jl
      - name: Verify direct docs instantiation uses this checkout (Julia 1.11+)
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate(); @assert realpath(Base.find_package("ProximalBase")) == realpath("src/ProximalBase.jl")'
      - name: Prepare documentation environment
        run: |
          julia scripts/instantiate.jl docs
          git diff --exit-code -- docs/Project.toml
      - name: Build strict documentation, doctests and isolated Literate examples
        run: |
          set -o pipefail
          julia --project=docs docs/make.jl 2>&1 | tee "${RUNNER_TEMP}/pb-docs-build.log"
      - name: Check rendered internal links and navigation
        run: |
          set -o pipefail
          python3 docs/check_html.py 2>&1 | tee "${RUNNER_TEMP}/pb-docs-html.log"
      - name: Report documentation migration preservation
        run: |
          set -o pipefail
          scope_args=()
          if [[ -n "${PB_DOCS_SCOPE_BASE:-}" ]]; then
            scope_args=(--scope-base "$PB_DOCS_SCOPE_BASE")
          fi
          python3 -B docs/check_migration.py --check all --build docs/build "${scope_args[@]}" 2>&1 | tee "${RUNNER_TEMP}/pb-docs-migration.log"
      - name: Report removed documentation lines against the change base
        run: |
          set -o pipefail
          python3 -B docs/check_migration_lines.py "$PB_DOCS_DIFF_BASE" 2>&1 | tee "${RUNNER_TEMP}/pb-docs-removed-lines.log"
      - name: Preserve rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-linux-current-julia
          path: docs/build
          if-no-files-found: error
      - name: Preserve documentation validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-validation-logs-linux-julia-1.13
          path: ${{ runner.temp }}/pb-docs-*.log
          if-no-files-found: ignore
  required:
    name: PR required jobs
    if: always()
    needs: [changes, test, benchmark, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require the validation lanes that the classification calls for
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          TEST_RESULT: ${{ needs.test.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT docs_only='$DOCS_ONLY'"
          echo "test=$TEST_RESULT benchmark=$BENCHMARK_RESULT docs=$DOCS_RESULT"
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          case "$DOCS_ONLY" in
            true)  test "$TEST_RESULT" = skipped; test "$BENCHMARK_RESULT" = skipped ;;
            false) test "$TEST_RESULT" = success; test "$BENCHMARK_RESULT" = success ;;
            *)     echo "unclassified change: '$DOCS_ONLY'"; exit 1 ;;
          esac
  gate:
    name: PR merge gate
    if: always()
    needs: [required]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation verdict
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success
  publish-preview:
    name: Publish PR documentation preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    needs: [gate, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    steps:
      # Untrusted PR code runs only in the read-only validation jobs.
      # This privileged job checks out gh-pages, never the PR branch, and
      # publishes the already validated HTML artifact without executing it.
      - name: Checkout published pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Download the validated documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation-linux-current-julia
          path: ${{ runner.temp }}/docs-preview
      - name: Publish isolated PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HTML_DIR: ${{ runner.temp }}/docs-preview
        shell: bash
        run: |
          set -euo pipefail
          preview_dir="previews/PR${PR_NUMBER}"
          mkdir -p "${preview_dir}"
          rsync -a --delete "${HTML_DIR}/" "${preview_dir}/"
          git add -A -- "${preview_dir}"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "docs: publish preview for PR ${PR_NUMBER}"
            git push origin HEAD:gh-pages
          fi
      - name: Show PR preview link in the workflow summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/PR${PR_NUMBER}/"
          {
            echo "## Documentation preview"
            echo ""
            echo "Published validated documentation for PR #${PR_NUMBER}:"
            echo ""
            echo "${preview_url}"
            echo ""
            echo "If the new page is not immediately visible, GitHub Pages may still be updating."
          } >> "${GITHUB_STEP_SUMMARY}"
  deploy-docs:
    name: Publish validated documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [gate, docs]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # This job holds the gh-pages-writes lock. It publishes when the fetched
      # tip of master equals this commit at the time of the check, and skips
      # the publication otherwise.
      - name: Check that this commit is the master tip
        id: tip
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/master
          tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "This run does not publish: master is at $tip, not $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.tip.outputs.current == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - if: steps.tip.outputs.current == 'true'
        uses: julia-actions/cache@v3
      - name: Prepare documentation environment
        if: steps.tip.outputs.current == 'true'
        run: julia scripts/instantiate.jl docs
      - name: Retrieve the validated HTML artifact
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: documentation-linux-current-julia
          path: docs/build
      - name: Publish development documentation
        if: steps.tip.outputs.current == 'true'
        run: julia --project=docs docs/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
