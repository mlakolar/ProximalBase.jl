name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia 1 / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Test declared minimal inventory
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=yes"])'
      - name: Prepare benchmark environment
        run: julia scripts/instantiate.jl benchmark
      - name: Check frozen benchmark references
        env:
          PB_BASELINE: ${{ runner.temp }}/pb849-baseline
          PB_CANDIDATE: ${{ github.workspace }}
          PB_CHECK_ONLY: '1'
        run: |
          mkdir -p "$PB_BASELINE"
          git archive eff21b6d7d33c622313122f46c6ee71693c101ee src | tar -x -C "$PB_BASELINE"
          julia --project=benchmark benchmark/run.jl
      - name: Prepare documentation environment
        run: julia scripts/instantiate.jl docs
      - name: Build documentation and extension example
        run: julia --project=docs docs/make.jl
  required:
    name: PR required jobs
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux current-Julia validation
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
  gate:
    name: PR merge gate
    if: always()
    needs: [required]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation verdict
        env:
          REQUIRED_RESULT: ${{ needs.required.result }}
        run: test "$REQUIRED_RESULT" = success
