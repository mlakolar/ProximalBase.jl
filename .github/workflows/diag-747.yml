name: diag-747
# Throwaway diagnostic for issue #747: never merged. Package code on this branch = master (merged in).
# Stage BASE: the test change only (the helper tests error where _scale_pow2 does not exist).
# Stage HEAD: the test change and the src change of the fix branch.
on:
  push:
    branches: [diag/issue-747]
jobs:
  probe:
    name: probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - uses: julia-actions/cache@v3
      - run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      # ---------------- BASE ----------------
      - name: base, apply the test change
        run: |
          git apply --ignore-whitespace diag747/test.patch
          git diff --stat
      - name: base, focused test (scripts/test.jl)
        continue-on-error: true
        run: |
          julia --color=no scripts/test.jl normfused_infinite_fusion 2>&1 | tee base-test-$RUNNER_OS.txt
      - name: base, test file run directly (a summary per test set)
        continue-on-error: true
        run: |
          julia --project --color=no --check-bounds=yes -e 'include("test/normfused_infinite_fusion.jl")' 2>&1 | tee base-direct-$RUNNER_OS.txt
      - name: base, failing items
        continue-on-error: true
        run: |
          grep -nE "Test Failed|Error During Test|Test threw|Test Summary|Pass +Fail|Pass +Error|\| +[0-9]+ +[0-9]+|UndefVarError|precision [0-9]+:|^p=[0-9]+" base-direct-$RUNNER_OS.txt > items-base-$RUNNER_OS.txt || true
          wc -l items-base-$RUNNER_OS.txt
          grep -nE "Test Failed|Error During Test|Test threw|Passed|Failed|FAILED" base-test-$RUNNER_OS.txt | head -60 || true
      - name: base, probe
        continue-on-error: true
        run: julia --project diag747/probe.jl 2>&1 | tee probe-$RUNNER_OS.txt
      - name: base, differential
        continue-on-error: true
        run: julia --project diag747/differential.jl base.txt && wc -l base.txt
      - name: base, IR
        continue-on-error: true
        run: |
          julia --project diag747/ir.jl 2>&1 | tee ir-base.txt
          julia --project diag747/ir_exact.jl 2>&1 | tee ir-exact-base.txt

      # ---------------- HEAD ----------------
      - name: head, apply the src change
        run: |
          git apply --ignore-whitespace diag747/src.patch
          git diff --stat -- src
          julia --project -e 'using Pkg; Pkg.precompile()'
      - name: head, focused test (scripts/test.jl)
        id: headtest
        continue-on-error: true
        run: |
          julia --color=no scripts/test.jl normfused_infinite_fusion 2>&1 | tee head-test-$RUNNER_OS.txt
      - name: head, test file run directly (a summary per test set)
        continue-on-error: true
        run: |
          julia --project --color=no --check-bounds=yes -e 'include("test/normfused_infinite_fusion.jl")' 2>&1 | tee head-direct-$RUNNER_OS.txt
          grep -nE "Test Failed|Error During Test|Test threw|Test Summary|Pass +Fail|Pass +Error|\| +[0-9]+ +[0-9]+|UndefVarError|precision [0-9]+:|^p=[0-9]+" head-direct-$RUNNER_OS.txt > items-head-$RUNNER_OS.txt || true
      - name: head, probe
        continue-on-error: true
        run: julia --project diag747/probe.jl 2>&1 | tee probe-head-$RUNNER_OS.txt
      - name: head, differential
        continue-on-error: true
        run: julia --project diag747/differential.jl head.txt && wc -l head.txt
      - name: head, IR
        continue-on-error: true
        run: |
          julia --project diag747/ir.jl 2>&1 | tee ir-head.txt
          julia --project diag747/ir_exact.jl 2>&1 | tee ir-exact-head.txt

      # ---------------- whole-call value benchmark, base and head alternating (the src patch is reversed and reapplied) ----------------
      - name: value bench
        continue-on-error: true
        run: |
          for r in 1 2 3; do
            if [ $((r % 2)) -eq 1 ]; then
              git apply --ignore-whitespace -R diag747/src.patch
              julia --project diag747/value_bench.jl 2>&1 | tee vb-base-r$r.txt
              git apply --ignore-whitespace diag747/src.patch
              julia --project diag747/value_bench.jl 2>&1 | tee vb-head-r$r.txt
            else
              julia --project diag747/value_bench.jl 2>&1 | tee vb-head-r$r.txt
              git apply --ignore-whitespace -R diag747/src.patch
              julia --project diag747/value_bench.jl 2>&1 | tee vb-base-r$r.txt
              git apply --ignore-whitespace diag747/src.patch
            fi
          done
          git diff --stat -- src
          python3 -I diag747/bench_table.py | tee value-bench-$RUNNER_OS.txt

      # ---------------- comparison ----------------
      - name: comparison
        continue-on-error: true
        run: |
          echo "== sweep FAIL counts"
          grep -n "FAIL count" probe-$RUNNER_OS.txt probe-head-$RUNNER_OS.txt || true
          echo "== differential"
          diff base.txt head.txt > differential-$RUNNER_OS.diff || true
          wc -l differential-$RUNNER_OS.diff
          python3 -I diag747/classify.py base.txt head.txt | tee families-$RUNNER_OS.txt
          echo "== IR of the originals, raw (timings excluded)"
          grep -v '^TIMING' ir-base.txt > ir-base.cmp.txt
          grep -v '^TIMING' ir-head.txt > ir-head.cmp.txt
          cmp ir-base.cmp.txt ir-head.cmp.txt && echo "originals: IR byte-identical" || echo "originals: IR DIFFERS"
          diff ir-base.cmp.txt ir-head.cmp.txt > ir-raw-$RUNNER_OS.diff || true
          wc -l ir-raw-$RUNNER_OS.diff
          echo "== exact siblings vs originals (head)"
          grep -E "^(IR exact|exact siblings|ALLOC|TIMING|return types)" ir-exact-head.txt || true
          echo "== allocations and timings of the originals"
          grep -hE "^(ALLOC|TIMING)" ir-base.txt | sed 's/^/base /'
          grep -hE "^(ALLOC|TIMING)" ir-head.txt | sed 's/^/head /'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.os }}
          path: |
            *.txt
            *.diff
      - name: fail if the head focused test failed
        if: steps.headtest.outcome == 'failure'
        run: |
          echo "the head focused test failed"
          exit 1
