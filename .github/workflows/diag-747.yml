name: diag-747
# Throwaway diagnostic for issue #747, option C (never merged). BASE = master (this tree); HEAD = master plus the src and ext of the
# issue branch (diag747/head-src.patch). Jobs: the differential in six runs (Windows and Linux, and Linux with the exponent range of
# Windows as the oracle), its comparison, Float32/Float64 IR / allocations / timings, and the focused tests at the head.
on:
  push:
    branches: [diag/issue-747]
  workflow_dispatch:
jobs:
  diff:
    name: diff ${{ matrix.run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, run: W-base, patch: 'no', range: ''}
          - {os: windows-latest, run: W-head, patch: 'yes', range: ''}
          - {os: ubuntu-latest, run: L-base, patch: 'no', range: ''}
          - {os: ubuntu-latest, run: L-head, patch: 'yes', range: ''}
          - {os: ubuntu-latest, run: Lw-base, patch: 'no', range: 'win'}
          - {os: ubuntu-latest, run: Lw-head, patch: 'yes', range: 'win'}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: apply the src and ext of the issue branch
        if: matrix.patch == 'yes'
        run: |
          git apply --ignore-whitespace diag747/head-src.patch
          git diff --stat
      - name: the differential
        env:
          EXPRANGE: ${{ matrix.range }}
        run: |
          date
          julia --project --color=no diag747/diff2.jl diff-${{ matrix.run }}.txt
          date
          wc -l diff-${{ matrix.run }}.txt
          ls -la diff-${{ matrix.run }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diff-${{ matrix.run }}
          path: diff-${{ matrix.run }}.txt
          compression-level: 6

  compare:
    name: compare the differentials
    needs: diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          merge-multiple: true
          path: artifacts
      - run: ls -la artifacts
      - name: compare
        run: python3 -I diag747/compare2.py artifacts 2>&1 | tee compare.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: compare.txt

  perf:
    name: perf ${{ matrix.os }} julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        julia: ['1.10', '1.13.3']
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ matrix.os }}-julia-${{ matrix.julia }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: IR, allocations and timings, base and head alternating (the patch is reversed and reapplied)
        run: |
          git apply --ignore-whitespace diag747/head-src.patch      # start at the head
          for r in 1 2 3; do
            if [ $((r % 2)) -eq 1 ]; then
              git apply --ignore-whitespace -R diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-base-r$r.txt 2>&1
              git apply --ignore-whitespace diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-head-r$r.txt 2>&1
            else
              julia --project --color=no diag747/perf.jl > vb-head-r$r.txt 2>&1
              git apply --ignore-whitespace -R diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-base-r$r.txt 2>&1
              git apply --ignore-whitespace diag747/head-src.patch
            fi
          done
          PYTHONIOENCODING=utf-8 python3 -I diag747/bench_table.py | tee perf-$LABEL.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}-julia-${{ matrix.julia }}
          path: |
            perf-*.txt
            vb-*.txt

  tests:
    name: tests ${{ matrix.os }} julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        julia: ['1.10', '1.13.3']
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: apply the src, ext and tests of the issue branch
        run: |
          git apply --ignore-whitespace diag747/head-src.patch
          git apply --ignore-whitespace diag747/head-test.patch
          git diff --stat
      - name: focused tests
        continue-on-error: true
        id: focused
        run: |
          julia --color=no scripts/test.jl ldexp_bigfloat normfused_infinite_fusion int32_exponents utils docstrings aqua soc rotatedsoc expcone scaled_overflow nested_scaled value_overflow ordered sets norms separable nonconvex fibers distance image calculus composition 2>&1 | tee focused-${{ matrix.os }}-julia-${{ matrix.julia }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-julia-${{ matrix.julia }}
          path: focused-*.txt
      - name: fail if the focused tests failed
        if: steps.focused.outcome == 'failure'
        run: exit 1
