name: diag-747
# Throwaway diagnostic for issue #747, option C (never merged). BASE = master (this tree); HEAD = master plus the src and ext of the
# issue branch (diag747/head-src.patch). Jobs: the differential in six runs (Windows and Linux, and Linux with the exponent range of
# Windows as the oracle), its comparison, Float32/Float64 IR / allocations / timings, and the focused tests at the head.
on:
  push:
    branches: [diag/issue-747]
  workflow_dispatch:
jobs:
  diff:
    name: diff ${{ matrix.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, tag: W, range: '', variants: 'base head head2'}
          - {os: ubuntu-latest, tag: L, range: '', variants: 'base head'}
          - {os: ubuntu-latest, tag: Lw, range: 'win', variants: 'base head'}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: 'the differential on one machine - base (master), head (the src and ext of the issue branch), head2 (head with the exponent sums of _exceptional_product in Int)'
        env:
          EXPRANGE: ${{ matrix.range }}
        run: |
          for v in ${{ matrix.variants }}; do
            if [ "$v" = head ]; then git apply --ignore-whitespace diag747/head-src.patch; fi
            if [ "$v" = head2 ]; then git apply --ignore-whitespace diag747/exc-product.patch; fi
            date
            julia --project --color=no diag747/diff2.jl diff-${{ matrix.tag }}-$v.txt
            date
            wc -l diff-${{ matrix.tag }}-$v.txt
          done
          git diff --stat
      - name: the mechanisms behind the remaining differences
        continue-on-error: true
        env:
          EXPRANGE: ${{ matrix.range }}
        run: |
          git diff --quiet || true
          julia --project --color=no diag747/probe_mismatch.jl 2>&1 | tee probe-${{ matrix.tag }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diff-${{ matrix.tag }}
          path: |
            diff-${{ matrix.tag }}-*.txt
            probe-${{ matrix.tag }}.txt
          compression-level: 6

  compare:
    name: compare the differentials
    if: github.event_name == 'workflow_dispatch'
    needs: diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          merge-multiple: true
          path: artifacts
      - run: ls -la artifacts
      - name: compare
        run: python3 -I diag747/compare2.py artifacts 2>&1 | tee compare.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: compare.txt

  perf:
    name: perf ${{ matrix.os }} julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        julia: ['1.10', '1.13.3']
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ matrix.os }}-julia-${{ matrix.julia }}
      ROUNDS: ${{ matrix.julia == '1.10' && 7 || 3 }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: IR, allocations and timings, base and head alternating (the patch is reversed and reapplied)
        run: |
          git apply --ignore-whitespace diag747/head-src.patch      # start at the head
          for r in $(seq 1 $ROUNDS); do
            if [ $((r % 2)) -eq 1 ]; then
              git apply --ignore-whitespace -R diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-base-r$r.txt 2>&1
              git apply --ignore-whitespace diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-head-r$r.txt 2>&1
            else
              julia --project --color=no diag747/perf.jl > vb-head-r$r.txt 2>&1
              git apply --ignore-whitespace -R diag747/head-src.patch
              julia --project --color=no diag747/perf.jl > vb-base-r$r.txt 2>&1
              git apply --ignore-whitespace diag747/head-src.patch
            fi
          done
          PYTHONIOENCODING=utf-8 python3 -I diag747/bench_table.py | tee perf-$LABEL.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}-julia-${{ matrix.julia }}
          path: |
            perf-*.txt
            vb-*.txt

  tests:
    name: tests ${{ matrix.os }} julia ${{ matrix.julia }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        julia: ['1.10', '1.13.3']
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: apply the src, ext and tests of the issue branch
        run: |
          git apply --ignore-whitespace diag747/head-src.patch
          git apply --ignore-whitespace diag747/head-test.patch
          git diff --stat
      - name: focused tests
        continue-on-error: true
        id: focused
        run: |
          julia --color=no scripts/test.jl ldexp_bigfloat normfused_infinite_fusion int32_exponents utils docstrings aqua soc rotatedsoc expcone scaled_overflow nested_scaled value_overflow ordered sets norms separable nonconvex fibers distance image calculus composition 2>&1 | tee focused-${{ matrix.os }}-julia-${{ matrix.julia }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-julia-${{ matrix.julia }}
          path: focused-*.txt
      - name: fail if the focused tests failed
        if: steps.focused.outcome == 'failure'
        run: exit 1
