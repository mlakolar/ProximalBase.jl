name: Full validation
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Full / ${{ matrix.os }} / Julia ${{ matrix.julia }} (shard ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia: ['1.10', '1.13']
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Run the full tier (shard ${{ matrix.shard }}/3)
        env:
          PB_OS: ${{ matrix.os }}
          PB_JULIA: ${{ matrix.julia }}
          PB_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # A workspace-relative path avoids mixing Windows and POSIX temporary paths.
          mkdir -p full-validation-logs
          log="full-validation-logs/full-validation-${PB_OS}-${PB_JULIA}-${PB_SHARD}.log"
          printf 'PB_FULL_VALIDATION commit=%s os=%s julia=%s shard=%s/3\n' \
            "$(git rev-parse HEAD)" "$PB_OS" "$PB_JULIA" "$PB_SHARD" | tee "$log"
          julia -e 'using InteractiveUtils; versioninfo()' 2>&1 | tee -a "$log"
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--tier=full","--shard=" * ENV["PB_SHARD"] * "/3"], julia_args=["--check-bounds=yes"])' 2>&1 | tee -a "$log"
      - name: Preserve full validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-validation-log-${{ matrix.os }}-${{ matrix.julia }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: full-validation-logs/full-validation-${{ matrix.os }}-${{ matrix.julia }}-${{ matrix.shard }}.log
          retention-days: 30
          if-no-files-found: error
  verdict:
    name: Full validation verdict
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the verdict script
        run: python3 -B scripts/test_full_validation_verdict.py
      # The pattern selects artifact names that carry this run attempt. If it matches
      # nothing, the verdict script reports each expected cell as missing. A rerun
      # passes only if it reran all 18 matrix jobs; a cell left on an earlier
      # attempt is reported missing.
      - name: Download the cell logs
        uses: actions/download-artifact@v8
        with:
          pattern: full-validation-log-*-attempt-${{ github.run_attempt }}
          path: logs
          merge-multiple: false
      - name: Fetch the job conclusions of this run attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | {name, conclusion}' > jobs.jsonl
      - name: Check the full selection in every cell
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # GITHUB_SHA is set by the runner: the commit the scheduled or dispatched run checked out.
          python3 scripts/full_validation_verdict.py --logs logs --tiers test/tiers.toml \
            --jobs jobs.jsonl --attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-commit "$GITHUB_SHA" --aggregate "$TEST_RESULT" --summary "$GITHUB_STEP_SUMMARY"
