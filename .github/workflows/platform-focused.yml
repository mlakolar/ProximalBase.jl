name: Platform focus
# Runs ONE test file of this repository on native Windows, macOS and Linux (and one Julia version),
# on demand, for a branch or a commit. It is advisory: nothing in CI.yml, its verdict or gate, or
# branch protection refers to it.
#
#   gh workflow run platform-focused.yml --ref <branch> -f os=both -f test_file=<name>
#
# The inputs are `os` (windows, macos, linux, both = windows and macos, all), `test_file` (a test
# name exactly as in test/tiers.toml, such as `three_factor_product` or `conformance/tolerances`),
# `julia_version` (1, lts, pre, 1.N or 1.N.P, not below the bound of Project.toml) and the optional
# `expected_sha` (the run fails unless the dispatched commit starts with it). The plan job checks
# the inputs (scripts/platform_focus.jl, tested in test/platform_focus.jl) before any job on another
# system is queued. The test job runs scripts/test.jl with a selector that selects that file and no
# other, and fails unless the runner's own header line says so. The inputs reach the shell only as
# environment variables. CONTRIBUTING.md describes the workflow.
run-name: Focus ${{ inputs.test_file }} on ${{ inputs.os }}, Julia ${{ inputs.julia_version }}
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Systems (both: Windows and macOS; all: also Linux, as a comparator)'
        type: choice
        options: [windows, macos, linux, both, all]
        default: both
      test_file:
        description: 'The test file, as named in test/tiers.toml (for example three_factor_product)'
        type: string
        required: true
      julia_version:
        description: 'Julia version: 1, lts, pre, 1.N or 1.N.P'
        type: string
        default: '1'
      expected_sha:
        description: 'Optional: the start (7 to 40 hex digits) of the commit that must be tested'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # A later dispatch for the same branch, file, systems and Julia version replaces an earlier one.
  group: platform-focused-${{ github.ref }}-${{ inputs.test_file }}-${{ inputs.os }}-${{ inputs.julia_version }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      test_file: ${{ steps.plan.outputs.test_file }}
      safe_name: ${{ steps.plan.outputs.safe_name }}
      selector: ${{ steps.plan.outputs.selector }}
      julia_version: ${{ steps.plan.outputs.julia_version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Check the inputs and plan the jobs
        id: plan
        env:
          FOCUS_OS: ${{ inputs.os }}
          FOCUS_TEST_FILE: ${{ inputs.test_file }}
          FOCUS_JULIA_VERSION: ${{ inputs.julia_version }}
          FOCUS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          # The script exits 0 (planned) or 1 (an input was refused: the error lines say which).
          # Another status (a crash, or the time limit) is retried once.
          for attempt in 1 2; do
            status=0
            timeout 120 julia --startup-file=no scripts/platform_focus.jl plan || status=$?
            { [ $status -eq 0 ] || [ $status -eq 1 ]; } && exit $status
            echo "::warning::The plan did not finish (attempt $attempt, status $status)."
          done
          exit 1
  focus:
    name: ${{ matrix.label }}, Julia ${{ needs.plan.outputs.julia_version }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # {"include": [{os, arch, label}, ...]}, written by the plan job.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the commit
        env:
          PLANNED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          echo "Checked out $head (planned $PLANNED_SHA)"
          if [ "$head" != "$PLANNED_SHA" ]; then
            echo "::error::The checked-out commit is not the planned commit."
            exit 1
          fi
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ needs.plan.outputs.julia_version }}
          arch: ${{ matrix.arch }}
      - name: Run the test file
        id: tests
        env:
          SELECTOR: ${{ needs.plan.outputs.selector }}
          TEST_FILE: ${{ needs.plan.outputs.test_file }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/focus"
          mkdir -p "$out"
          read -ra args <<< "$SELECTOR"
          echo "Testing $TEST_FILE with the selector: $SELECTOR"
          start=$(date +%s)
          status=0
          julia --color=no scripts/test.jl --verbose --jobs=1 "${args[@]}" 2>&1 | tee "$out/test-output.log" || status=$?
          echo $(( $(date +%s) - start )) > "$out/seconds"
          exit $status
      - name: Check the selection in the log
        # Also after failed tests: the runner prints what it selected before any worker starts.
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TEST_FILE: ${{ needs.plan.outputs.test_file }}
        run: julia --startup-file=no scripts/platform_focus.jl check-log "$RUNNER_TEMP/focus/test-output.log" "$TEST_FILE"
      - name: Timing summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        env:
          TEST_REPORT_TITLE: ${{ matrix.label }}, Julia ${{ needs.plan.outputs.julia_version }}, ${{ needs.plan.outputs.test_file }}
        run: julia --startup-file=no scripts/test_report.jl "$RUNNER_TEMP/focus/test-output.log" "$(cat "$RUNNER_TEMP/focus/seconds")" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the metadata
        if: ${{ !cancelled() }}
        env:
          SELECTOR: ${{ needs.plan.outputs.selector }}
          TEST_FILE: ${{ needs.plan.outputs.test_file }}
          LABEL: ${{ matrix.label }}
        run: |
          out="$RUNNER_TEMP/focus"
          mkdir -p "$out"
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "ref: $GITHUB_REF"
            echo "run: $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT"
            echo "system: $LABEL, $RUNNER_OS $RUNNER_ARCH, image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "test file: $TEST_FILE"
            echo "selector: $SELECTOR"
            echo "seconds: $(cat "$out/seconds" 2>/dev/null || echo not run)"
            julia --startup-file=no -e 'using InteractiveUtils; versioninfo()' || echo "Julia did not run"
          } > "$out/metadata.txt" 2>&1
          mkdir -p "$out/test/$(dirname "$TEST_FILE")"
          cp "test/$TEST_FILE.jl" "$out/test/$TEST_FILE.jl" || true
          {
            echo
            echo "### Run metadata"
            echo
            sed 's/^/    /' "$out/metadata.txt" | tr -d '\r'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log tail in the summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          log="$RUNNER_TEMP/focus/test-output.log"
          {
            echo
            echo "### Failures and the end of the log"
            echo
            grep -E 'Test Failed|Error During Test|Got exception|Expression:|Evaluated:|^ERROR|Error:' "$log" | head -n 40 | tr -d '\r' | sed 's/^/    /' || true
            echo
            echo "    ..."
            tail -n 60 "$log" | tr -d '\r' | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the log, the metadata and the test file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: focus-${{ needs.plan.outputs.safe_name }}-${{ matrix.label }}-${{ needs.plan.outputs.julia_version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focus
          if-no-files-found: warn
          retention-days: 14
