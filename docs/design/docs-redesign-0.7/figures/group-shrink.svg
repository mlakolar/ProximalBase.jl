    <polyline points="190.00,44.00 190.00,236.00" fill="none" stroke="#8492a6" stroke-width="1.5" />
    <polyline points="105.38,137.00 105.38,143.00" fill="none" stroke="#8492a6" stroke-width="1.5" />
    <text x="105.4" y="157.0" fill="#586577" text-anchor="middle" font-size="12">-2</text>
