    <text x="196.0" y="46.0" fill="#586577" text-anchor="start" font-style="italic">x₂</text>
    <circle cx="190.00" cy="140.00" r="42.31" fill="#e3ebf8" stroke="#1e55b3" stroke-width="1.5" stroke-dasharray="5 4" />
