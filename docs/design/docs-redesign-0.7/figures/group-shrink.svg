    <text x="340.0" y="150.0" fill="#586577" text-anchor="start" font-size="12">Inside the disc ‖u‖ ≤ γλ:</text>
    <text x="340.0" y="166.0" fill="#586577" text-anchor="start" font-size="12">the whole group is set to 0.</text>
    <text x="340.0" y="190.0" fill="#586577" text-anchor="start" font-size="12">Outside: ‖u‖ shrinks by γλ,</text>
    <text x="340.0" y="206.0" fill="#586577" text-anchor="start" font-size="12">direction unchanged.</text>
