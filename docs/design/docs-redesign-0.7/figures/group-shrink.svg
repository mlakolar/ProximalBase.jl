<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-labelledby="title description">
  <title id="title">Group soft thresholding (GroupNormL2, weight 1)</title>
  <desc id="description">Points inside the disc of radius γλ = 1 map to zero. Points outside move toward the origin along their own direction, and their length decreases by one.</desc>
