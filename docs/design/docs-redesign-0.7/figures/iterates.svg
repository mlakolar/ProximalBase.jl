<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title description">
  <title id="title">One vector, three ways to store it</title>
  <desc id="description">A dense vector stores every entry. A SparseIterate stores a working set of entry indices with their values, which may include a deliberately active zero. A BlockIterate divides the entries into ordered groups and works with whole groups.</desc>
