<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="title description">
  <title id="title">Shrink along the same group direction</title>
  <desc id="description">Move from (3, 4) to (1.8, 2.4), decreasing the vector length from five to three.</desc>
  <rect width="480" height="240" rx="12" fill="#f7f9fc" />
  <g font-family="system-ui, sans-serif" font-size="15" fill="#192438" stroke-linecap="round" stroke-linejoin="round">
    <text x="24" y="28" fill="#192438" text-anchor="start">Shrink along the same group direction</text>
    <polyline points="128.00,56.00 128.00,203.00 376.00,203.00" fill="none" stroke="#8492a6" stroke-width="1.5" />
    <polyline points="128.00,203.00 227.00,71.00" fill="none" stroke="#1e55b3" stroke-width="3" />
    <polyline points="128.00,203.00 187.40,123.80" fill="none" stroke="#aa4b20" stroke-width="4" />
    <circle cx="187.4" cy="123.8" r="4.5" fill="#aa4b20" />
    <circle cx="227" cy="71" r="4.5" fill="#1e55b3" />
    <text x="239" y="75" fill="#1e55b3" text-anchor="start">u = (3, 4)</text>
    <text x="200" y="131" fill="#aa4b20" text-anchor="start">z = (1.8, 2.4)</text>
    <text x="118" y="224" fill="#586577" text-anchor="start">0</text>
  </g>
</svg>
