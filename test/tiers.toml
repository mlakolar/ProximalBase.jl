# Exhaustive catalogs whose cases repeat paths the tiers above already reach, and family files
# that the CI rules run beside any change to their family. The device-array suites on GPUArrays'
# reference backend (gpu, gpu_smoke, conformance/gpu_arrays) are here: the nightly run covers
# them, and a change to the GPU files, the GPU extension or the label test:gpu runs them in a
# pull request. The CPU catalogs that load JLArrays as a second array type stay in the tiers
# above, and the ambiguity guard for the GPU extension is in quick (gpu_extension_ambiguities).
# The <name>_grids files hold the Float32 passes and type grids of six quick files (atom_iterate,
# conjugate_basics, constrained_basics, lmo_atoms, nested_scaled, sparse_iterate_basics): the cases
# there repeat cases that stay in the base file for Float64, a Float32 representative or a
# representative function (test/TESTING.md lists them). The base file of constrained_basics_grids
# is constrained_basics, a quick file. A pull request adds a grids file as a focus
# file for a change to the source of its own family (.github/tier-rules.toml); a run of the full
# tier (including a pull request whose tier is full) or by name also runs them.
