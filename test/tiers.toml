# The test tiers. Read by test/tiers.jl, test/runtests.jl and scripts/ci_plan.jl; checked by
# test/tier_selection.jl. CONTRIBUTING.md explains the workflow, test/TESTING.md records why each
# file sits where it does, and .github/tier-rules.toml says which tier CI runs for a change.
#
# [tiers]: each test file (its path under test/ without .jl) is listed once, under the lowest
# tier that runs it. A tier runs its own files and those of every tier above it in this file,
# so full runs every test file. A new test file must be added here: an unlisted file stops
# every test run and the CI plan job.

