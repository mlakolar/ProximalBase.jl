# Test tiers and the CI risk policy. Read by test/tiers.jl, test/runtests.jl and
# scripts/ci_plan.jl; checked by test/tier_selection.jl. CONTRIBUTING.md explains the workflow
# and test/TESTING.md records why each file sits where it does.
#
# [tiers]: each test file (its path under test/ without .jl) is listed once, under the lowest
# tier that runs it. A tier runs its own files and those of every tier above it in this file,
# so full runs every test file. A new test file must be added here: an unlisted file stops
# every test run and the CI plan job.

[tiers]
quick = [
  # loading, interface, traits and package quality
  "aqua",
  "compat",
  "docstrings",
  "interface",
  "readme",
  "tier_selection",
  "utils",
  # iterates: active sets, value writes versus state copies, symmetric coordinates, aliasing
  "active_handle",
  "atom_iterate",
  "iterate_queries",
  "matrixview",
  "sparse_iterate_basics",
  "symmetric_parameters",
  "symmetric_products",
  # values, gradients and proximal operators of representative functions
  "caches",
  "conjugate_basics",
  "constrained_basics",
  "entropy",
  "intersection",
  "lla",
  "nested_box_values",
  "sets",
  "spectral",
  "spectralfunction",
  # precision, boundaries, non-finite values, validation before writes
  "block_step_failures",
  "conformance/tolerances",
  "model_precision",
  "scaled_overflow",
  "spectral_box_tolerance",
  "spectral_mask",
  # device arrays and hot-path allocations
  "allocations_basics",
  "gpu_smoke",
  "lapack",
  "deprecated",
]

