[not_tests]
# Included by test files or by the runner, never run on their own.
helpers = ["conformance/common", "gpu_ambiguities", "gpu_prelude", "gpu_suite", "gpu_suite_basics", "testutils", "tiers"]
# Directories with a Project.toml of their own, run by hand: cuda/ needs an NVIDIA GPU and
# oracles/ needs JuMP and conic solvers. No tier runs them.
environments = ["cuda", "oracles"]

[not_tests.run_through]
# The test files that run each helper, directly or through another helper; the error for a
# helper given as a test name names them. A helper that the runner loads for every test file
# (testutils, conformance/common) has no entry. A helper under a directory is a quoted key.
gpu_ambiguities = ["gpu_extension_ambiguities", "gpu_smoke"]
gpu_prelude = ["gpu", "gpu_smoke"]
gpu_suite = ["gpu"]
gpu_suite_basics = ["gpu_smoke"]
tiers = ["tier_selection"]
